<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OmniTrace logo</title>
  <desc id="desc">A cyan and violet trace pulse inside a dark rounded square.</desc>
  <defs>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#08111f"/>
  <path d="M116 304h66l34-104 52 184 42-126 26 46h60" fill="none" stroke="url(#trace)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="116" cy="304" r="12" fill="#67e8f9"/>
  <circle cx="396" cy="304" r="12" fill="#a78bfa"/>
</svg>
